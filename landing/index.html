  <div id="__bundler_placeholder">Loading Document360 Lotus: Docs as code, synced both ways...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er; align-self: center; max-width: 820px; font-size: clamp(30px, 4vw, 44px); line-height: 1.12; font-weight: 700; letter-spacing: -1.1px; color: #18181b\">Most teams keep two copies of every doc<\u002Fh2><p style=\"margin: 0; text-align: center; align-self: center; max-width: 720px; font-size: 18px; line-height: 1.6; color: #5f5f69\">Developers keep Markdown in the repo. Everyone else keeps a pasted copy in the knowledge base. Every release, the two drift further apart.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 320px; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 20px; padding: 32px; box-shadow: 0 1px 2px rgba(24,24,27,.04), 0 18px 40px rgba(76,52,130,.08); display: flex; flex-direction: column; gap: 14px\">\n<span style=\"align-self: flex-start; font-size: 13px; font-weight: 700; color: #a12f2f; background: #fdeeee; border-radius: 999px; padding: 4px 12px\">Without Lotus<\u002Fspan>\n<p style=\"margin: 0; font-size: 24px; line-height: 1.3; font-weight: 600; color: #18181b\">Two sources of truth, and neither is right for long<\u002Fp>\n<div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><span style=\"color: #a12f2f; font-weight: 700\">✕<\u002Fspan>Writers can't fix a typo without a developer or a terminal<\u002Fdiv><div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><span style=\"color: #a12f2f; font-weight: 700\">✕<\u002Fspan>Changes in GitHub get copied into the knowledge base by hand<\u002Fdiv><div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><span style=\"color: #a12f2f; font-weight: 700\">✕<\u002Fspan>Edits in the knowledge base never make it back to the repo<\u002Fdiv><div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><span style=\"color: #a12f2f; font-weight: 700\">✕<\u002Fspan>Nobody knows which version is current<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 320px; background: linear-gradient(180deg, #ffffff 0%, #f2eefb 100%); border: 1px solid #ccbbf0; border-radius: 20px; padding: 32px; box-shadow: 0 1px 2px rgba(24,24,27,.04), 0 18px 40px rgba(76,52,130,.12); display: flex; flex-direction: column; gap: 14px\">\n<span style=\"align-self: flex-start; font-size: 13px; font-weight: 700; color: #ffffff; background: #6941c6; border-radius: 999px; padding: 4px 12px\">With Lotus<\u002Fspan>\n<p style=\"margin: 0; font-size: 24px; line-height: 1.3; font-weight: 600; color: #18181b\">One source of truth, two ways to edit it<\u002Fp>\n<div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#f2eefb\"><\u002Fcircle><path d=\"M6 10.3l2.6 2.6L14 7.5\" stroke=\"#6941c6\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Developers commit and review in GitHub, like they already do<\u002Fspan><\u002Fdiv><div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#f2eefb\"><\u002Fcircle><path d=\"M6 10.3l2.6 2.6L14 7.5\" stroke=\"#6941c6\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Writers and PMs edit in the Document360 editor<\u002Fspan><\u002Fdiv><div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#f2eefb\"><\u002Fcircle><path d=\"M6 10.3l2.6 2.6L14 7.5\" stroke=\"#6941c6\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Changes sync to the other side, in both directions<\u002Fspan><\u002Fdiv><div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#f2eefb\"><\u002Fcircle><path d=\"M6 10.3l2.6 2.6L14 7.5\" stroke=\"#6941c6\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>The repo and the knowledge base stay aligned<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fsection><section id=\"conflicts\" style=\"background: radial-gradient(55% 70% at 88% 0%, rgba(236,72,153,.22), rgba(0,0,0,0) 60%), linear-gradient(rgba(255,255,255,.045) 1px, rgba(0,0,0,0) 1px) 0 0 / 40px 40px, linear-gradient(90deg, rgba(255,255,255,.045) 1px, rgba(0,0,0,0) 1px) 0 0 / 40px 40px, linear-gradient(135deg, #0d0824 0%, #1d1170 60%, #2a1ab9 100%); padding: 112px max(24px, calc((100% - 1120px) / 2)); display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; align-items: center\"><p style=\"margin: 0; text-align: center; font-size: 14px; font-weight: 600; color: #c4b5fd; letter-spacing: .2px\">Conflicts, handled<\u002Fp><h2 style=\"margin: 0; text-align: center; max-width: 820px; font-size: clamp(30px, 4vw, 44px); line-height: 1.12; font-weight: 700; letter-spacing: -1.1px; color: #ffffff\">When GitHub and Document360 disagree, you decide.<\u002Fh2><p style=\"margin: 0; text-align: center; max-width: 720px; font-size: 18px; line-height: 1.6; color: #d6d0f5\">Developers and writers can change the same article at the same time. Lotus never silently overwrites either side.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 40px; align-items: center\"><div style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 12px\"><div class=\"cs-step cs-k0\" style=\"position: relative; overflow: hidden; display: flex; gap: 16px; align-items: flex-start; padding: 18px 18px 22px; border-radius: 16px; border: 1px solid rgba(255,255,255,.08)\">\n<span class=\"cs-num cs-k0\" style=\"display: flex; flex-shrink: 0; width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.10); color: #ffffff; align-items: center; justify-content: center; font-size: 15px; font-weight: 700\">1<\u002Fspan>\n<div class=\"cs-text cs-k0\" style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 19px; font-weight: 600; color: #ffffff\">Lotus spots it<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: #d6d0f5\">When a GitHub commit and a Document360 edit change the same article, Lotus flags the conflict instead of picking a winner.<\u002Fspan><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; left: 18px; right: 18px; bottom: 10px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.10); overflow: hidden\"><div class=\"cs-bar cs-k0\" style=\"height: 3px; width: 0; border-radius: 2px; background: linear-gradient(90deg, #a78bfa, #f472b6)\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><div class=\"cs-step cs-k1\" style=\"position: relative; overflow: hidden; display: flex; gap: 16px; align-items: flex-start; padding: 18px 18px 22px; border-radius: 16px; border: 1px solid rgba(255,255,255,.08)\">\n<span class=\"cs-num cs-k1\" style=\"display: flex; flex-shrink: 0; width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.10); color: #ffffff; align-items: center; justify-content: center; font-size: 15px; font-weight: 700\">2<\u002Fspan>\n<div class=\"cs-text cs-k1\" style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 19px; font-weight: 600; color: #ffffff\">See both versions side by side<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: #d6d0f5\">Each changed block shows the GitHub version next to the Document360 version, so anyone can read what's different.<\u002Fspan><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; left: 18px; right: 18px; bottom: 10px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.10); overflow: hidden\"><div class=\"cs-bar cs-k1\" style=\"height: 3px; width: 0; border-radius: 2px; background: linear-gradient(90deg, #a78bfa, #f472b6)\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><div class=\"cs-step cs-k2\" style=\"position: relative; overflow: hidden; display: flex; gap: 16px; align-items: flex-start; padding: 18px 18px 22px; border-radius: 16px; border: 1px solid rgba(255,255,255,.08)\">\n<span class=\"cs-num cs-k2\" style=\"display: flex; flex-shrink: 0; width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.10); color: #ffffff; align-items: center; justify-content: center; font-size: 15px; font-weight: 700\">3<\u002Fspan>\n<div class=\"cs-text cs-k2\" style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 19px; font-weight: 600; color: #ffffff\">Choose and resolve<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: #d6d0f5\">Keep GitHub's, keep yours, or keep both, then mark the article resolved. While someone is resolving it, the article is locked for others.<\u002Fspan><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; left: 18px; right: 18px; bottom: 10px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.10); overflow: hidden\"><div class=\"cs-bar cs-k2\" style=\"height: 3px; width: 0; border-radius: 2px; background: linear-gradient(90deg, #a78bfa, #f472b6)\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div style=\"flex: 1 1 460px; position: relative; min-height: 380px; border-radius: 24px; background: linear-gradient(180deg, #f6f3fd 0%, #ffffff 100%); border: 1px solid rgba(255,255,255,.4); box-shadow: 0 f5f69\">Commit in GitHub or edit in Document360, and changes sync in both directions. The Git status in the editor shows where things stand.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section id=\"repo\" style=\"background: radial-gradient(#e2daf6 1px, rgba(0,0,0,0) 1.4px) 0 0 / 24px 24px, linear-gradient(180deg, #f6f3fd 0%, #ffffff 100%); padding: 112px max(24px, calc((100% - 1120px) / 2)); display: flex; flex-direction: column; gap: 48px\"><div style=\"display: flex; flex-direction: column; gap: 16px; align-items: center\"><p style=\"margin: 0; text-align: center; align-self: center; font-size: 14px; font-weight: 600; color: #6941c6; letter-spacing: .2px\">Bring your repo<\u002Fp><h2 style=\"margin: 0; text-align: center; align-self: center; max-width: 820px; font-size: clamp(30px, 4vw, 44px); line-height: 1.12; font-weight: 700; letter-spacing: -1.1px; color: #18181b\">Your folders become your knowledge base<\u002Fh2><p style=\"margin: 0; text-align: center; align-self: center; max-width: 720px; font-size: 18px; line-height: 1.6; color: #5f5f69\">A small d360.json file in your repository maps folders to categories and Markdown files to articles. It's required to connect a repository.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px\"><div style=\"flex: 1 1 260px; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 18px; padding: 16px; box-shadow: 0 1px 2px rgba(24,24,27,.04), 0 18px 40px rgba(76,52,130,.08); display: flex; flex-direction: column; gap: 6px\"><div style=\"display: flex; align-items: center; gap: 10px; font-size: 15.5px; font-weight: 600; color: #18181b; padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid #f4f4f5\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 16 16\" fill=\"#18181b\" aria-hidden=\"true\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82- 2.8-4.5 5.5-4.6z\"><\u002Fpath><path d=\"M23.7 14.4c-1 0-2-.3-2.9-.7-.1 1.3-.4 2.3-.4 2.3-2 5.4-6.4 5.1-6.4 5.1H8.9L.5 27.2h12.8c8.4-.3 11.7-5.6 11.7-5.6 2.4-3.2 3.1-6.6 3.2-9.2-1.1 1.2-2.7 2-4.5 2z\"><\u002Fpath><circle cx=\"23.7\" cy=\"8.3\" r=\"4\"><\u002Fcircle><\u002Fsvg>Categories<\u002Fdiv><div style=\"display: flex; align-items: center; gap: 10px; padding: 5px 8px; padding-left: 8px; border-radius: 8px; font-size: 14.5px; color: #3e3e46; font-weight: 400; background: transparent\"><span style=\"width: 18px; height: 14px; border-radius: 3px; background: #7f56d9; flex-shrink: 0\"><\u002Fspan>Getting started<\u002Fdiv><div style=\"display: flex; align-items: center; gap: 10px; padding: 5px 8px; padding-left: 28px; border-radius: 8px; font-size: 14.5px; color: #3e3e46; font-weight: 400; background: transparent\"><span style=\"width: 14px; height: 17px; border-radius: 2px; border: 1.6px solid #a0a0aa; flex-shrink: 0; background: #ffffff\"><\u002Fspan>Overview<\u002Fdiv><div style=\"display: flex; align-items: center; gap: 10px; padding: 5px 8px; padding-left: 28px; border-radius: 8px; font-size: 14.5px; color: #4c3482; font-weight: 600; background: #f2eefb\"><span style=\"width: 14px; height: 17px; border-radius: 2px; border: 1.6px solid #7f56d9; flex-shrink: 0; background: #ffffff\"><\u002Fspan>Quick start<\u002Fdiv><div style=\"display: flex; align-items: center; gap: 10px; padding: 5px 8px; padding-left: 8px; border-radius: 8px; font-size: 14.5px; color: #3e3e46; font-weight: 400; background: transparent\"><span style=\"width: 18px; height: 14px; border-radius: 3px; background: #7f56d9; flex-shrink: 0\"><\u002Fspan>API reference<\u002Fdiv><div style=\"display: flex; align-items: center; gap: 10px; padding: 5px 8px; padding-left: 28px; border-radius: 8px; font-size: 14.5px; color: #3e3e46; font-weight: 400; background: transparent\"><span style=\"width: 14px; height: 17px; border-radius: 2px; border: 1.6px solid #a0a0aa; flex-shrink: 0; background: #ffffff\"><\u002Fspan>Webhooks<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px; background: #18181b; border-radius: 18px; padding: 20px\">\n<div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap\"><span style=\"font-size: 15px; font-weight: 600; color: #ffffff\">No d360.json yet? Let your coding agent write it.<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ copyPrompt }}\" style=\"margin-left: auto; min-height: 40px; padding: 0 16px; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; background: rgba(255,255,255,.08); color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">{{ copyLabel }}<\u002Fbutton><\u002Fdiv>\n<pre id=\"agent-prompt\" style=\"margin: 0; white-space: pre-wrap; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13.5px; line-height: 1.6; color: #e4e1f5; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 14px 16px\">[Prompt text from product: paste into Claude Code, Cursor or Codex to create and commit d360.json]<\u002Fpre>\n<span style=\"font-size: 13px; color: #a1a1aa\">Paste it into Claude Code, Cursor or Codex, let the agent commit the file, then re-check in Document360.<\u002Fspan>\n<\u002Fdiv><\u002Fsection><section style=\"background: radial-gradient(#e2daf6 1px, rgba(0,0,0,0) 1.4px) 0 0 / 24px 24px, linear-gradient(180deg, #f6f3fd 0%, #ffffff 100%); padding: 112px max(24px, calc((100% - 1120px) / 2)); display: flex; flex-direction: column; gap: 48px\"><div style=\"display: flex; flex-direction: column; gap: 16px; align-items: center\"><p style=\"margin: 0; text-align: center; align-self: center; font-size: 14px; font-weight: 600; color: #6941c6; letter-spacing: .2px\">For Document360 customers<\u002Fp><h2 style=\"margin: 0; text-align: center; align-self: center; max-width: 820px; font-size: clamp(30px, 4vw, 44px); line-height: 1.12; font-weight: 700; letter-spacing: -1.1px; color: #18181b\">Already using our GitHub extension?<\u002Fh2><p style=\"margin: 0; text-align: center; align-self: center; max-width: 720px; font-size: 18px; line-height: 1.6; color: #5f5f69\">Document360 Lotus is the new docs-as-code project type, synced with GitHub in both directions. The one-way extension keeps working for existing projects.<\u002Fp><\u002Fdiv>\n<p class=\"lp-scroll-hint\" style=\"margin: 0; text-align: center; font-size: 13px; font-weight: 600; color: #6941c6\">Swipe sideways to see the full comparison →<\u002Fp>\n<div style=\"width: 100%; border: 1px solid #e4e4e7; border-radius: 20px; overflow-x: auto; background: #ffffff; box-shadow: 0 1px 2px rgba(24,24,27,.04), 0 24px 48px rgba(76,52,130,.10)\"><div style=\"min-width: 620px\">\n<div style=\"display: flex\"><div style=\"flex: 0 0 28%; padding: 16px 24px; font-size: 13px; font-weight: 700; color: #5f5f69\">&nbsp;<\u002Fdiv><div style=\"flex: 1 1 0; padding: 16px 24px; font-size: 13px; font-weight: 700; color: #6941c6; background: #f2eefb\">Document360 Lotus<\u002Fdiv><div style=\"flex: 1 1 0; padding: 16px 24px; font-size: 13px; font-weight: 700; color: #5f5f69\">GitHub extension<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; border-top: 1px solid #e4e4e7\"><div style=\"flex: 0 0 28%; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #18181b\">Sync direction<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #4c3482; background: #f2eefb\">Both ways<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; color: #5f5f69\">GitHub to Document360 only<\u002Fdiv><\u002Fdiv><div style=\"display: flex; border-top: 1px solid #e4e4e7\"><div style=\"flex: 0 0 28%; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #18181b\">Branches<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #4c3482; background: #f2eefb\">Any branch; working branches and pull requests at general availability<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; color: #5f5f69\">Main branch only<\u002Fdiv><\u002Fdiv><div style=\"display: flex; border-top: 1px solid #e4e4e7\"><div style=\"flex: 0 0 28%; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #18181b\">Folder structure<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #4c3482; background: #f2eefb\">Any subdirectory, mapped by d360.json<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; color: #5f5f69\">Fixed docs/ folder<\u002Fdiv><\u002Fdiv><div style=\"display: flex; border-top: 1px solid #e4e4e7\"><div style=\"flex: 0 0 28%; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #18181b\">Edits in Document360<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #4c3482; background: #f2eefb\">Become commits in GitHub<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; color: #5f5f69\">Stay in Document360<\u002Fdiv><\u002Fdiv><div style=\"display: flex; border-top: 1px solid #e4e4e7\"><div style=\"flex: 0 0 28%; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #18181b\">Conflicts<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #4c3482; background: #f2eefb\">Resolved side by side in the editor<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; color: #5f5f69\">Not handled<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section id=\"faq\" style=\"background: linear-gradient(180deg, #fafafa 0%, #f4f0fd 100%); padding: 112px max(24px, calc((100% - 1120px) / 2)); display: flex; flex-direction: column; gap: 48px\"><div style=\"display: flex; flex-wrap: wrap; gap: 40px 80px; align-items: flex-start\"><div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 14px\"><p style=\"margin: 0;  font-size: 14px; font-weight: 600; color: #6941c6; letter-spacing: .2px\">FAQ<\u002Fp><h2 style=\"margin: 0; font-size: 40px; line-height: 1.12; font-weight: 700; letter-spacing: -1px; color: #18181b\">Questions, answered<\u002Fh2><p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #5f5f69\">Want the details before early access opens? Here are the ones we hear most.<\u002Fp><\u002Fdiv><div style=\"flex: 2 1 420px; border-bottom: 1px solid #e4e4e7\"><details class=\"faq-item\" open=\"\" style=\"border-top: 1px solid #e4e4e7\"><summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0; cursor: pointer; list-style: none\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">What is docs as code?<\u002Fh3><span style=\"display: flex; flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; background: #f2eefb; align-items: center; justify-content: center\"><svg class=\"faq-chev\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M5 7.5l5 5 5-5\" stroke=\"#6941c6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary><p style=\"margin: 0; padding: 0 52px 24px 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">An approach where documentation lives in a version-controlled repository, is written in plain text such as Markdown, and goes through the same review as code. Lotus brings it to Document360 without locking out non-developers.<\u002Fp><\u002Fdetails><details class=\"faq-item\" style=\"border-top: 1px solid #e4e4e7\"><summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0; cursor: pointer; list-style: none\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">Do our docs stay in our own repository?<\u002Fh3><span style=\"display: flex; flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; background: #f2eefb; align-items: center; justify-content: center\"><svg class=\"faq-chev\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M5 7.5l5 5 5-5\" stroke=\"#6941c6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary><p style=\"margin: 0; padding: 0 52px 24px 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">Yes. Your articles are Markdown files in your GitHub repository, and Document360 syncs with them.<\u002Fp><\u002Fdetails><details class=\"faq-item\" style=\"border-top: 1px solid #e4e4e7\"><summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0; cursor: pointer; list-style: none\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">Do writers need to know Git, or have a GitHub account?<\u002Fh3><span style=\"display: flex; flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; background: #f2eefb; align-items: center; justify-content: center\"><svg class=\"faq-chev\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M5 7.5l5 5 5-5\" stroke=\"#6941c6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary><p style=\"margin: 0; padding: 0 52px 24px 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">No to both. Writers edit and publish in the Document360 editor, and what each person can do follows their Document360 role. Lotus handles the Git. Branches and pull requests in the editor arrive with general availability.<\u002Fp><\u002Fdetails><details class=\"faq-item\" style=\"border-top: 1px solid #e4e4e7\"><summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0; cursor: pointer; list-style: none\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">What is d360.json?<\u002Fh3><span style=\"display: flex; flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; background: #f2eefb; align-items: center; justify-content: center\"><svg class=\"faq-chev\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M5 7.5l5 5 5-5\" stroke=\"#6941c6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary><p style=\"margin: 0; padding: 0 52px 24px 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">A small file in your repository that maps folders to categories and Markdown files to articles. It's required to connect a repository. Your coding agent can write it from a prompt Lotus gives you, or you can start from a template.<\u002Fp><\u002Fdetails><details class=\"faq-item\" style=\"border-top: 1px solid #e4e4e7\"><summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0; cursor: pointer; list-style: none\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">What happens if GitHub and Document360 change the same article?<\u002Fh3><span style=\"display: flex; flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; background: #f2eefb; align-items: center; justify-content: center\"><svg class=\"faq-chev\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M5 7.5l5 5 5-5\" stroke=\"#6941c6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary><p style=\"margin: 0; padding: 0 52px 24px 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">Lotus shows each conflict side by side. Keep the version from GitHub, keep yours, or keep both, then mark the article resolved.<\u002Fp><\u002Fdetails><details class=\"faq-item\" style=\"border-top: 1px solid #e4e4e7\"><summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0; cursor: pointer; list-style: none\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">How does publishing work?<\u002Fh3><span style=\"display: flex; flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; background: #f2eefb; align-items: center; justify-content: center\"><svg class=\"faq-chev\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M5 7.5l5 5 5-5\" stroke=\"#6941c6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary><p style=\"margin: 0; padding: 0 52px 24px 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">Publish lists your pending changes in one dialog and writes them to GitHub as one commit. With general availability, publishing to a protected branch opens a pull request instead, so your review rules still apply.<\u002Fp><\u002Fdetails><details class=\"faq-item\" style=\"border-top: 1px solid #e4e4e7\"><summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0; cursor: pointer; list-style: none\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">Which Git providers and GitHub plans are supported?<\u002Fh3><span style=\"display: flex; flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; background: #f2eefb; align-items: center; justify-content: center\"><svg class=\"faq-chev\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M5 7.5l5 5 5-5\" stroke=\"#6941c6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary><p style=\"margin: 0; padding: 0 52px 24px 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">Lotus works with repositories on GitHub.com. GitHub Enterprise Server and GitHub Enterprise Cloud with data residency (GHE.com) aren't supported. GitLab, Bitbucket and Azure DevOps aren't supported yet.<\u002Fp><\u002Fdetails><details class=\"faq-item\" style=\"border-top: 1px solid #e4e4e7\"><summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0; cursor: pointer; list-style: none\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">Can we move an existing Document360 project to Lotus?<\u002Fh3><span style=\"display: flex; flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; background: #f2eefb; align-items: center; justify-content: center\"><svg class=\"faq-chev\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M5 7.5l5 5 5-5\" stroke=\"#6941c6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary><p style=\"margin: 0; padding: 0 52px 24px 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">Lotus is a new project type, so existing Document360 projects aren't converted. You can create a Lotus project and connect your repository, and the one-way GitHub extension keeps working for existing projects.<\u002Fp><\u002Fdetails><details class=\"faq-item\" style=\"border-top: 1px solid #e4e4e7\"><summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0; cursor: pointer; list-style: none\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">When will Lotus be available?<\u002Fh3><span style=\"display: flex; flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; background: #f2eefb; align-items: center; justify-content: center\"><svg class=\"faq-chev\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M5 7.5l5 5 5-5\" stroke=\"#6941c6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsummary><p style=\"margin: 0; padding: 0 52px 24px 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">Early access starts in the first week of December 2026 for selected teams from the waitlist. General availability, including branches, pull requests and Merge &amp; publish in the editor, is planned for January 2027.<\u002Fp><\u002Fdetails><\u002Fdiv><\u002Fdiv><\u002Fsection><section style=\"position: relative; overflow: hidden; background: #ffffff; padding: 96px max(24px, calc((100% - 1120px) / 2)) 112px\">\n<div ref=\"{{ setCtaHost }}\" aria-hidden=\"true\" style=\"position: absolute; left: 0; right: 0; top: 0; bottom: 0; overflow: hidden; pointer-events: none\"><canvas ref=\"{{ setCtaCanvas }}\" aria-hidden=\"true\" style=\"position: absolute; left: 0; top: 0; display: block; width: 100%; height: 100%\"><\u002Fcanvas><\u002Fdiv>\n<div style=\"position: relative; z-index: 1; max-width: 820px; margin: 0 auto; border-radius: 32px; padding: clamp(40px, 6vw, 72px) clamp(20px, 5vw, 64px); background: rgba(255,255,255,.88); border: 1px solid #e5ddf7; box-shadow: 0 30px 80px rgba(76,52,130,.18); display: flex; flex-direction: column; gap: 22px; align-items: center\">\n<img src=\"5b9344e0-f260-4b78-9df5-8e6e4bc3450b\" alt=\"The Lotus mascot\" style=\"width: 120px; height: 120px; filter: drop-shadow(0 14px 24px rgba(127,86,217,.35))\">\n<h2 style=\"margin: 0; text-align: center; font-size: clamp(32px, 4.4vw, 48px); line-height: 1.1; font-weight: 700; letter-spacing: -1.2px; color: #18181b\">Your docs in GitHub.<br><span style=\"color: #7f56d9\">Your team in Document360.<\u002Fspan><\u002Fh2>\n<p style=\"margin: 0; text-align: center; font-size: 18px; color: #5f5f69\">Join the waitlist and be first to sync your repo both ways.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 12px; align-items: center\"><a href=\"#join\" sc-camel-on-click=\"{{ openForm }}\" style=\"display: inline-flex; align-items: center; justify-content: center; height: 52px; padding: 0 26px; border-radius: 12px; background: #6941c6; color: #ffffff; font-size: 16px; font-weight: 600; text-decoration: none; white-space: nowrap\">Join the waitlist<\u002Fa><p style=\"margin: 0; font-size: 14px; color: #5f5f69; text-align: center\">Be among the first to experience it. Early access spots are limited.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection><div id=\"join\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"join-title\" style=\"{{ modalStyle }}\" sc-camel-on-click=\"{{ backdropClose }}\">\n<div style=\"position: relative; width: 100%; max-width: 680px; margin: auto; background: #ffffff; border-radius: 24px; padding: clamp(24px, 4vw, 36px); box-sizing: border-box; box-shadow: 0 40px 100px rgba(13,8,36,.45); display: flex; flex-direction: column; gap: 18px\">\n<button type=\"button\" sc-camel-on-click=\"{{ closeForm }}\" aria-label=\"Close\" style=\"position: absolute; right: 14px; top: 14px; width: 44px; height: 44px; border: 0; border-radius: 12px; background: #f4f4f5; color: #3e3e46; font-family: inherit; font-size: 22px; line-height: 1; cursor: pointer\">×<\u002Fbutton>\n<img src=\"b31c296b-29a1-4bbc-8741-4c3b451ac581\" alt=\"Document360\" style=\"display: block; width: 162px; height: 21px\"><div style=\"display: flex; align-items: center; gap: 12px; padding-right: 48px\"><img src=\"5b9344e0-f260-4b78-9df5-8e6e4bc3450b\" alt=\"\" style=\"width: 48px; height: 48px\"><div style=\"display: flex; flex-direction: column; gap: 2px\"><h2 id=\"join-title\" style=\"margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -.4px; color: #18181b\">Join the Lotus waitlist<\u002Fh2><span style=\"font-size: 14px; color: #5f5f69\">Docs as code, synced both ways with GitHub.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<form id=\"waitlist\" action=\"https://document360v2.wpengine.com/lotus-waitlist-2/\" method=\"post\" style=\"width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 640px; box-sizing: border-box; padding: 20px; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 18px; box-shadow: 0 1px 2px rgba(24,24,27,.05), 0 10px 30px rgba(76,52,130,.10); text-align: left\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px\">\n<label style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 13px; font-weight: 600; color: #3e3e46\">Work email<\u002Fspan><input id=\"email\" name=\"email\" type=\"email\" required=\"\" placeholder=\"you@company.com\" autocomplete=\"email\" style=\"height: 46px; width: 100%; box-sizing: border-box; border: 1px solid #e4e4e7; border-radius: 10px; padding: 0 12px; font-family: inherit; font-size: 15px; color: #18181b; background: #ffffff\"><\u002Flabel>\n<label style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 13px; font-weight: 600; color: #3e3e46\">Company<\u002Fspan><input id=\"company\" name=\"company\" type=\"text\" required=\"\" placeholder=\"Company name\" autocomplete=\"organization\" style=\"height: 46px; width: 100%; box-sizing: border-box; border: 1px solid #e4e4e7; border-radius: 10px; padding: 0 12px; font-family: inherit; font-size: 15px; color: #18181b; background: #ffffff\"><\u002Flabel>\n<label style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 13px; font-weight: 600; color: #3e3e46\">Existing Document360 customer?<\u002Fspan><sc-raw-select id=\"customer\" name=\"existing_customer\" required=\"\" style=\"height: 46px; width: 100%; box-sizing: border-box; border: 1px solid #e4e4e7; border-radius: 10px; padding: 0 12px; font-family: inherit; font-size
