  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

    </div>

</head>
<body>
  <div id="__bundler_placeholder">Loading Document360 Lotus: Docs as code, synced both ways...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg> GitHub<\u002Fspan>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection><section style=\"background: #fafafa; padding: 112px clamp(20px, 8vw, 120px); display: flex; flex-direction: column; gap: 48px\"><div style=\"display: flex; flex-direction: column; gap: 16px; align-items: center\"><p style=\"margin: 0; text-align: center; align-self: center; font-size: 14px; font-weight: 600; color: #6941c6; letter-spacing: .2px\">The problem<\u002Fp><h2 style=\"margin: 0; text-align: center; align-self: center; max-width: 820px; font-size: clamp(30px, 4vw, 44px); line-height: 1.12; font-weight: 700; letter-spacing: -1.1px; color: #18181b\">Most teams keep two copies of every doc<\u002Fh2><p style=\"margin: 0; text-align: center; align-self: center; max-width: 720px; font-size: 18px; line-height: 1.6; color: #5f5f69\">Developers keep Markdown in the repo. Everyone else keeps a pasted copy in the help center. Every release, the two drift further apart.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 320px; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"align-self: flex-start; font-size: 13px; font-weight: 700; color: #a12f2f; background: #fdeeee; border-radius: 999px; padding: 4px 12px\">Without Lotus<\u002Fspan>\n<p style=\"margin: 0; font-size: 24px; line-height: 1.3; font-weight: 600; color: #18181b\">Two sources of truth, and neither is right for long<\u002Fp>\n<div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><span style=\"color: #a12f2f; font-weight: 700\">✕<\u002Fspan>Writers can't fix a typo without a developer or a terminal<\u002Fdiv><div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><span style=\"color: #a12f2f; font-weight: 700\">✕<\u002Fspan>Changes in GitHub get copied into the help center by hand<\u002Fdiv><div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><span style=\"color: #a12f2f; font-weight: 700\">✕<\u002Fspan>Edits in the help center never make it back to the repo<\u002Fdiv><div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><span style=\"color: #a12f2f; font-weight: 700\">✕<\u002Fspan>Nobody knows which version is current<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 320px; background: #f2eefb; border: 1px solid #ccbbf0; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"align-self: flex-start; font-size: 13px; font-weight: 700; color: #ffffff; background: #6941c6; border-radius: 999px; padding: 4px 12px\">With Lotus<\u002Fspan>\n<p style=\"margin: 0; font-size: 24px; line-height: 1.3; font-weight: 600; color: #18181b\">One source of truth, two ways to edit it<\u002Fp>\n<div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#f2eefb\"><\u002Fcircle><path d=\"M6 10.3l2.6 2.6L14 7.5\" stroke=\"#6941c6\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Developers commit and review in GitHub, like they already do<\u002Fspan><\u002Fdiv><div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#f2eefb\"><\u002Fcircle><path d=\"M6 10.3l2.6 2.6L14 7.5\" stroke=\"#6941c6\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Writers and PMs edit in the Document360 editor<\u002Fspan><\u002Fdiv><div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#f2eefb\"><\u002Fcircle><path d=\"M6 10.3l2.6 2.6L14 7.5\" stroke=\"#6941c6\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Every change syncs to the other side automatically<\u002Fspan><\u002Fdiv><div style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.5; color: #3e3e46\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#f2eefb\"><\u002Fcircle><path d=\"M6 10.3l2.6 2.6L14 7.5\" stroke=\"#6941c6\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>The repo and the knowledge base always match<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fsection><section id=\"how\" style=\"background: #ffffff; padding: 112px clamp(20px, 8vw, 120px); display: flex; flex-direction: column; gap: 48px\"><div style=\"display: flex; flex-direction: column; gap: 16px; align-items: center\"><p style=\"margin: 0; text-align: center; align-self: center; font-size: 14px; font-weight: 600; color: #6941c6; letter-spacing: .2px\">How it works<\u002Fp><h2 style=\"margin: 0; text-align: center; align-self: center; max-width: 820px; font-size: clamp(30px, 4vw, 44px); line-height: 1.12; font-weight: 700; letter-spacing: -1.1px; color: #18181b\">From your repo to a live knowledge base in three steps<\u002Fh2><\u002Fdiv><div style=\"display: flex; flex-wrap: wrap; gap: 20px\"><div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 14px; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 20px; padding: 16px 16px 24px\">\n<img src=\"f013c43c-fcb9-401c-b349-865d41ba0f61\" alt=\"Step 1: choosing Document360 - Lotus\" style=\"display: block; width: 100%; height: 180px; object-fit: cover; object-position: top center; border-radius: 14px; border: 1px solid #e4e4e7\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; padding: 4px 8px 0\"><span style=\"font-size: 13px; font-weight: 700; color: #6941c6; font-family: 'IBM Plex Mono', monospace\">01<\u002Fspan><span style=\"font-size: 20px; font-weight: 600; color: #18181b\">Choose Lotus<\u002Fspan><span style=\"font-size: 15px; line-height: 1.55; color: #5f5f69\">Start a project and pick Document360 - Lotus, the docs-as-code path.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 14px; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 20px; padding: 16px 16px 24px\">\n<img src=\"6025e10e-0ad8-4d14-8ba8-97f2b48564f3\" alt=\"Connect with GitHub, repository and branch selected\" style=\"display: block; width: 100%; height: 180px; object-fit: cover; object-position: top center; border-radius: 14px; border: 1px solid #e4e4e7\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; padding: 4px 8px 0\"><span style=\"font-size: 13px; font-weight: 700; color: #6941c6; font-family: 'IBM Plex Mono', monospace\">02<\u002Fspan><span style=\"font-size: 20px; font-weight: 600; color: #18181b\">Connect GitHub<\u002Fspan><span style=\"font-size: 15px; line-height: 1.55; color: #5f5f69\">Authorize GitHub, install the app, and pick any repository and branch. Docs in a subfolder work too.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 14px; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 20px; padding: 16px 16px 24px\">\n<img src=\"ebcf0051-606f-4190-b3a4-d3246a3d4b79\" alt=\"Document360 editor with the Synced status\" style=\"display: block; width: 100%; height: 180px; object-fit: cover; object-position: top center; border-radius: 14px; border: 1px solid #e4e4e7\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; padding: 4px 8px 0\"><span style=\"font-size: 13px; font-weight: 700; color: #6941c6; font-family: 'IBM Plex Mono', monospace\">03<\u002Fspan><span style=\"font-size: 20px; font-weight: 600; color: #18181b\">Sync and keep working<\u002Fspan><span style=\"font-size: 15px; line-height: 1.55; color: #5f5f69\">Commit in GitHub or edit in Document360. The Git status shows Synced the moment both sides match.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section style=\"background: #fafafa; padding: 112px clamp(20px, 8vw, 120px); display: flex; flex-direction: column; gap: 48px\"><div style=\"display: flex; flex-direction: column; gap: 16px; align-items: center\"><p style=\"margin: 0; text-align: center; align-self: center; font-size: 14px; font-weight: 600; color: #6941c6; letter-spacing: .2px\">For Document360 customers<\u002Fp><h2 style=\"margin: 0; text-align: center; align-self: center; max-width: 820px; font-size: clamp(30px, 4vw, 44px); line-height: 1.12; font-weight: 700; letter-spacing: -1.1px; color: #18181b\">Already using our GitHub extension?<\u002Fh2><p style=\"margin: 0; text-align: center; align-self: center; max-width: 720px; font-size: 18px; line-height: 1.6; color: #5f5f69\">Lotus is the upgrade you asked for: the same knowledge base, now synced with GitHub in both directions.<\u002Fp><\u002Fdiv>\n<div style=\"width: 100%; max-width: 1000px; align-self: center; border: 1px solid #e4e4e7; border-radius: 20px; overflow-x: auto; background: #ffffff\"><div style=\"min-width: 620px\">\n<div style=\"display: flex\"><div style=\"flex: 0 0 28%; padding: 16px 24px; font-size: 13px; font-weight: 700; color: #5f5f69\">&nbsp;<\u002Fdiv><div style=\"flex: 1 1 0; padding: 16px 24px; font-size: 13px; font-weight: 700; color: #5f5f69\">GitHub extension<\u002Fdiv><div style=\"flex: 1 1 0; padding: 16px 24px; font-size: 13px; font-weight: 700; color: #6941c6; background: #f2eefb\">Document360 - Lotus<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; border-top: 1px solid #e4e4e7\"><div style=\"flex: 0 0 28%; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #18181b\">Sync direction<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; color: #5f5f69\">GitHub to Document360 only<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #4c3482; background: #f2eefb\">Both ways<\u002Fdiv><\u002Fdiv><div style=\"display: flex; border-top: 1px solid #e4e4e7\"><div style=\"flex: 0 0 28%; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #18181b\">Branches<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; color: #5f5f69\">Main branch only<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #4c3482; background: #f2eefb\">Any branch, plus working branches and pull requests<\u002Fdiv><\u002Fdiv><div style=\"display: flex; border-top: 1px solid #e4e4e7\"><div style=\"flex: 0 0 28%; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #18181b\">Folder structure<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; color: #5f5f69\">Fixed docs/ folder<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #4c3482; background: #f2eefb\">Any subdirectory, mapped by d360.json<\u002Fdiv><\u002Fdiv><div style=\"display: flex; border-top: 1px solid #e4e4e7\"><div style=\"flex: 0 0 28%; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #18181b\">Edits in Document360<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; color: #5f5f69\">Stay in Document360<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #4c3482; background: #f2eefb\">Become commits and pull requests<\u002Fdiv><\u002Fdiv><div style=\"display: flex; border-top: 1px solid #e4e4e7\"><div style=\"flex: 0 0 28%; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #18181b\">Conflicts<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; color: #5f5f69\">Not handled<\u002Fdiv><div style=\"flex: 1 1 0; padding: 18px 24px; font-size: 16px; font-weight: 600; color: #4c3482; background: #f2eefb\">Resolved side by side in the editor<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section id=\"teams\" style=\"background: #ffffff; padding: 112px clamp(20px, 8vw, 120px); display: flex; flex-direction: column; gap: 48px\"><div style=\"display: flex; flex-direction: column; gap: 16px; align-items: center\"><p style=\"margin: 0; text-align: center; align-self: center; font-size: 14px; font-weight: 600; color: #6941c6; letter-spacing: .2px\">For teams<\u002Fp><h2 style=\"margin: 0; text-align: center; align-self: center; max-width: 820px; font-size: clamp(30px, 4vw, 44px); line-height: 1.12; font-weight: 700; letter-spacing: -1.1px; color: #18181b\">Everyone works in the tool they already use<\u002Fh2><\u002Fdiv><div style=\"display: flex; flex-wrap: wrap; gap: 20px\"><div style=\"flex: 1 1 280px; display: flex; flex-direction: column; gap: 14px; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 20px; padding: 32px\"><span style=\"display: flex; width: 44px; height: 44px; border-radius: 12px; background: #f2eefb; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6941c6\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font-size: 22px; font-weight: 600; color: #18181b\">Developers<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6; color: #5f5f69\">Keep docs next to the code. Commit Markdown, review in pull requests, and never copy a page into a CMS again.<\u002Fspan><\u002Fdiv><div style=\"flex: 1 1 280px; display: flex; flex-direction: column; gap: 14px; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 20px; padding: 32px\"><span style=\"display: flex; width: 44px; height: 44px; border-radius: 12px; background: #f2eefb; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6941c6\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20h4L19 9l-4-4L4 16z\"><\u002Fpath><path d=\"M13.5 6.5l4 4\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font-size: 22px; font-weight: 600; color: #18181b\">Technical writers<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6; color: #5f5f69\">Edit in a real editor with branches and pull requests as buttons. Resolve conflicts in plain language.<\u002Fspan><\u002Fdiv><div style=\"flex: 1 1 280px; display: flex; flex-direction: column; gap: 14px; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 20px; padding: 32px\"><span style=\"display: flex; width: 44px; height: 44px; border-radius: 12px; background: #f2eefb; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6941c6\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font-size: 22px; font-weight: 600; color: #18181b\">Product managers<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6; color: #5f5f69\">One source of truth that ships with every release, with a full change list before anything goes live.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsection><section id=\"faq\" style=\"background: #fafafa; padding: 112px clamp(20px, 8vw, 120px); display: flex; flex-direction: column; gap: 48px\"><div style=\"display: flex; flex-wrap: wrap; gap: 40px 80px; align-items: flex-start\"><div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 14px\"><p style=\"margin: 0;  font-size: 14px; font-weight: 600; color: #6941c6; letter-spacing: .2px\">FAQ<\u002Fp><h2 style=\"margin: 0; font-size: 40px; line-height: 1.12; font-weight: 700; letter-spacing: -1px; color: #18181b\">Questions, answered<\u002Fh2><p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #5f5f69\">Want the details before early access opens? Here are the ones we hear most.<\u002Fp><\u002Fdiv><div style=\"flex: 2 1 420px; border-bottom: 1px solid #e4e4e7\"><div style=\"border-top: 1px solid #e4e4e7; padding: 24px 0; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">What is docs as code?<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">An approach where documentation lives in a version-controlled repository, is written in plain text such as Markdown, and goes through the same review as code. Lotus brings it to Document360 without locking out non-developers.<\u002Fp><\u002Fdiv><div style=\"border-top: 1px solid #e4e4e7; padding: 24px 0; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">Do writers need to know Git?<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">No. Branching, saving to a branch, opening a pull request and Merge &amp; publish are buttons in the Document360 editor. Lotus handles the Git.<\u002Fp><\u002Fdiv><div style=\"border-top: 1px solid #e4e4e7; padding: 24px 0; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">What is d360.json?<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">A small manifest in your repository that maps folders to categories and Markdown files to articles. Your coding agent can write it from a prompt Lotus gives you, or you can start from a template.<\u002Fp><\u002Fdiv><div style=\"border-top: 1px solid #e4e4e7; padding: 24px 0; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">What happens if GitHub and Document360 change the same article?<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">Lotus shows each conflict side by side. Keep the version from GitHub, keep yours, or keep both, then mark the article resolved.<\u002Fp><\u002Fdiv><div style=\"border-top: 1px solid #e4e4e7; padding: 24px 0; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">Can we bring our existing Document360 docs into GitHub?<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">Yes. Turn on Git Sync and choose Document360 to GitHub as the initial direction. Your articles become Markdown in the repository, then stay in sync both ways.<\u002Fp><\u002Fdiv><div style=\"border-top: 1px solid #e4e4e7; padding: 24px 0; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 600; color: #18181b\">Which Git providers does Lotus support?<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #5f5f69\">Lotus launches with GitHub.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section style=\"background: #ffffff; padding: 96px clamp(20px, 8vw, 120px) 112px; display: flex; flex-direction: column; gap: 48px\"><div style=\"position: relative; border-radius: 32px; padding: clamp(40px, 6vw, 72px) clamp(20px, 5vw, 64px); background: radial-gradient(50% 80% at 50% 0%, rgba(127,86,217,.22), rgba(127,86,217,0) 70%), #f2eefb; border: 1px solid #e5ddf7; display: flex; flex-direction: column; gap: 22px; align-items: center; overflow: hidden\">\n<img src=\"6413477c-7bd3-481d-b9e4-94599c5e7637\" alt=\"The Lotus mascot\" style=\"width: 120px; height: 120px; filter: drop-shadow(0 14px 24px rgba(127,86,217,.35))\">\n<h2 style=\"margin: 0; text-align: center; font-size: clamp(32px, 4.4vw, 48px); line-height: 1.1; font-weight: 700; letter-spacing: -1.2px; color: #18181b\">Your docs in GitHub.<br><span style=\"color: #7f56d9\">Your team in Document360.<\u002Fspan><\u002Fh2>\n<p style=\"margin: 0; text-align: center; font-size: 18px; color: #5f5f69\">Join the waitlist and be first to sync your repo both ways.<\u002Fp>\n<form id=\"waitlist2\" action=\"https://document360v2.wpengine.com/lotus-waitlist-2/\" method=\"get\" style=\"width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; width: 100%; max-width: 560px; box-sizing: border-box; padding: 6px; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 16px; box-shadow: 0 1px 2px rgba(24,24,27,.05), 0 10px 30px rgba(76,52,130,.10)\">\n<label for=\"email2\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Work email<\u002Flabel>\n<input id=\"email2\" name=\"email\" type=\"email\" required=\"\" placeholder=\"you@company.com\" style=\"flex: 1 1 220px; min-width: 0; height: 50px; border: 0; padding: 0 14px; font-family: inherit; font-size: 16px; color: #18181b; background: transparent; outline-offset: 2px; border-radius: 10px\">\n<button type=\"submit\" style=\"height: 50px; padding: 0 24px; border: 0; border-radius: 12px; background: #6941c6; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; white-space: nowrap\">Join the waitlist<\u002Fbutton>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; color: #5f5f69\">Be among the first to experience it. Early access spots are limited.<\u002Fp>\n<\u002Fform>\n<\u002Fdiv><\u002Fsection><footer style=\"padding: 32px clamp(20px, 8vw, 120p
